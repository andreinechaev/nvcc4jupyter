name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The package is pure Python (built as a universal py3-none-any wheel), so
      # a single interpreter is enough. We test the minimum supported version,
      # which guarantees compatibility across the whole ">=3.10" range.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CUDA toolkit
        run: |
          sudo apt update
          sudo apt install -y wget
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt update
          sudo apt -y install cuda-toolkit-12-6
          echo "PATH=$PATH:/usr/local/cuda/bin" >> $GITHUB_ENV

      - name: Install OpenCV
        run: |
          sudo apt install -y libopencv-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: List dependencies
        run: |
          python -m pip list

      - name: Run pytest
        run: |
          pytest -v

  # upload code coverage report
  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: "true"
      - run: git lfs pull

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CUDA toolkit
        run: |
          sudo apt update
          sudo apt install -y wget
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt update
          sudo apt -y install cuda-toolkit-12-6
          echo "PATH=$PATH:/usr/local/cuda/bin" >> $GITHUB_ENV

      - name: Install OpenCV
        run: |
          sudo apt install -y libopencv-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install pytest-cov[toml]

      - name: Run tests and collect coverage
        run: pytest --cov nvcc4jupyter

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
